<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />

    <!-- PWA: installable "Add to Home screen" app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores the manifest entirely and reads this line instead, and it
         wants a plain PNG. With an SVG here, "Add to Home Screen" on an iPhone
         gave a blank square or a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Auto Spares" />

    <title>Auto Spares — Shop System</title>

    <script>
      /* Put the saved Light/Dark choice on <html> before anything is drawn,
         so a staff member on dark mode never gets a white flash first. */
      (function () {
        try {
          var c = localStorage.getItem("bypass-theme") || "system";
          var dark =
            c === "dark" ||
            (c === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.background = "#0F141B";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0F141B");
          } else {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();

      /* And the shop's colour, for exactly the same reason.

         The stylesheet is read before the first paint and the app's JavaScript is not,
         so without this line every single load of an orange shop showed one frame of
         blue — the sign-in screen, which is the screen it shows most.

         IT DOES NOT WORK OUT WHICH COLOUR, deliberately. Repeating the palette or the
         per-shop defaults here would put them in a third place, and a third place is
         where they go out of step. All this does is replay whatever was painted last
         time on this device for this shop: src/lib/shopSkin.js writes the answer down
         under the key below every time it applies a skin, and this reads it back.

         So the very first visit on a new device still shows that one blue frame, once,
         and never again. A slug this misses — the old /jaspare and /shop links, which
         are aliases — finds nothing and gets the blue, which is the right answer for
         them anyway. */
      (function () {
        try {
          var slug = (location.pathname.split("/")[1] || "").toLowerCase();
          if (!slug) return;
          var seen = localStorage.getItem("bp_shop_skin_seen_" + slug);
          /* Checked, not trusted: this value ends up in an attribute selector. */
          if (seen && /^[a-z]+$/.test(seen) && seen !== "blue") {
            document.documentElement.dataset.shopSkin = seen;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker so the app installs & loads offline.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
