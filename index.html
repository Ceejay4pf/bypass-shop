<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />

    <!-- PWA: installable "Add to Home screen" app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores the manifest entirely and reads this line instead, and it
         wants a plain PNG. With an SVG here, "Add to Home Screen" on an iPhone
         gave a blank square or a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Auto Spares" />

    <title>Auto Spares — Shop System</title>

    <script>
      /* Put the saved Light/Dark choice on <html> before anything is drawn,
         so a staff member on dark mode never gets a white flash first. */
      (function () {
        try {
          var c = localStorage.getItem("bypass-theme") || "system";
          var dark =
            c === "dark" ||
            (c === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.background = "#0F141B";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0F141B");
          } else {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker so the app installs & loads offline.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
